[project]
name = "ytm-import"
version = "0.1.0"
description = "Bulk import text-file playlists into YouTube Music."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ytmusicapi>=1.12.3",
]

[project.scripts]
ytm-import = "ytm_import.cli:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["uv_build>=0.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
